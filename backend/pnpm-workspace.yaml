# pnpm 10 blocks dependency install scripts unless they are named here.
#
# mongodb-memory-server must be allowed: its postinstall fetches the mongod
# binary that every integration test runs against, and without it a clean
# install produces a suite that cannot start.
#
# The other two only build optional native speedups and are fine left off.
allowBuilds:
  mongodb-memory-server: true
  core-js: false
  unrs-resolver: false

# express 4 pins an old qs and body-parser, and the newest express 4 release
# still does. Both have published denial-of-service fixes within the same major
# version, so force them rather than wait for express 5.
overrides:
  qs: '>=6.16.0 <7'
  body-parser: '>=1.20.9 <2'
  # Express 4's own pins, behind published fixes in the same major: a
  # trust-subnet IP spoof (proxy-addr) and, through axios, credential headers
  # surviving a cross-origin redirect (follow-redirects).
  proxy-addr: '>=2.0.8 <3'
  follow-redirects: '>=1.16.2 <2'
