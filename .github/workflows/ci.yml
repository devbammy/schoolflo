name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, format, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # This repo is pnpm-managed. Using npm here silently does the wrong
      # thing against a pnpm-shaped node_modules.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . --max-warnings 60

      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.js" "tests/**/*.js" "server.js"

      # mongodb-memory-server downloads a mongod binary on first run; caching
      # it keeps subsequent CI runs fast.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars

  client:
    name: Client — lint, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --no-frozen-lockfile

      # The build alone was never enough. It compiles a component that was
      # never imported (which shipped once, as an undefined <BulkImportModal/>)
      # and it compiles a stray "/>" as literal text, which rendered on the
      # teacher's exam schedule page. Both are lint errors now.
      #
      # Warnings are mostly unused React imports left over from the old JSX
      # transform; the ceiling stops them growing while they are cleaned up.
      - name: Lint
        run: pnpm exec eslint src --ext .js,.jsx --max-warnings 130

      - name: Build
        run: pnpm run build
